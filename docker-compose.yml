services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: patacon
      POSTGRES_PASSWORD: patacon
      POSTGRES_DB: patacon
    ports:
      - "5432:5432"
    volumes:
      - patacon_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patacon -d patacon"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  patacon_pg:
